[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantagent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3", "numpy", "scipy", "scikit-learn", "lightgbm",
                "pyyaml", "python-dotenv", "sqlalchemy>=2", "psycopg[binary]>=3.1"]
 
[project.optional-dependencies]
dev = ["pytest"]
moomoo = ["moomoo-api==10.12.7208"]
dashboard = ["streamlit"]
agent = ["langgraph"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
